name: Build PalmTLS artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

env:
  PALM_TOOLCHAIN_ROOT: /opt/palm-toolchain
  PALM_TOOLCHAIN_PREFIX: /opt/palm-toolchain/.toolchain/prefix
  PALM_TOOLCHAIN_IMAGE: ghcr.io/palmsnipe/palm-toolchain-sdk@sha256:2c441bfa432785cf90e34fb5f4efe241c07a9e3666ee475119d856f96db3299f

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/palmsnipe/palm-toolchain-sdk@sha256:2c441bfa432785cf90e34fb5f4efe241c07a9e3666ee475119d856f96db3299f
      credentials:
        username: palmsnipe
        password: ${{ secrets.PALM_TOOLCHAIN_REGISTRY_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Trust checked-out source
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install application build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends imagemagick librsvg2-bin zip
          rm -rf /var/lib/apt/lists/*

      - name: Verify toolchain
        run: make -C "$PALM_TOOLCHAIN_ROOT" check

      - name: Build and test PalmTLS
        run: make check

      - name: Build release TLS Tester
        run: make -C apps/tls-tester release

      - name: Package outputs
        shell: bash
        run: |
          scripts/package-artifacts.sh
          (cd dist && sha256sum -c SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            version="$(sed -n 's/^LIB_VERSION := //p' library/app.mk)"
          fi
          scripts/package-release.sh "$version"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: palm-tls-${{ github.sha }}
          path: |
            dist/
            release-assets/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@v7
        with:
          name: palm-tls-${{ github.sha }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          wolfssl_commit="$(sed -n 's/^WOLFSSL_COMMIT="\([^"]*\)"/\1/p' dist/SOURCE.txt)"
          if [[ -z "$wolfssl_commit" ]]; then
            echo "Unable to determine the pinned wolfSSL commit." >&2
            exit 1
          fi
          notes="$(mktemp)"
          {
            echo "PalmTLS ${version}"
            echo
            echo "Install exactly one PalmTLS library variant, followed by TLS Tester if desired."
            echo "The ZIP contains all binaries, the public header, documentation, licenses, and checksums."
            echo
            echo "## Corresponding source"
            echo
            echo "- [PalmTLS ${version} source](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME})"
            echo "- [Exact wolfSSL source](https://github.com/wolfSSL/wolfssl/tree/${wolfssl_commit})"
            echo "- [Palm-specific wolfSSL patches](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/patches/wolfssl)"
            echo "- [Build scripts](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/scripts)"
            echo
            echo "This is a draft release. Review the assets and notes before publishing it."
          } >"$notes"

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "PalmTLS ${version}" \
            --notes-file "$notes"
