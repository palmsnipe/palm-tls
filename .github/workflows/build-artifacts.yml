name: Build PalmTLS release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PALM_TOOLCHAIN_ROOT: /opt/palm-toolchain
  PALM_TOOLCHAIN_PREFIX: /opt/palm-toolchain/.toolchain/prefix
  PALM_TOOLCHAIN_IMAGE: ghcr.io/palmsnipe/palm-toolchain-sdk@sha256:2c441bfa432785cf90e34fb5f4efe241c07a9e3666ee475119d856f96db3299f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/palmsnipe/palm-toolchain-sdk@sha256:2c441bfa432785cf90e34fb5f4efe241c07a9e3666ee475119d856f96db3299f
      credentials:
        username: palmsnipe
        password: ${{ secrets.PALM_TOOLCHAIN_REGISTRY_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out source
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install application build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends imagemagick librsvg2-bin zip python3 python3-venv
          rm -rf /var/lib/apt/lists/*

      - name: Validate release commit before building
        run: python3 scripts/release.py preflight

      - name: Verify toolchain
        run: make -C "$PALM_TOOLCHAIN_ROOT" check

      - name: Build and test PalmTLS
        run: make check

      - name: Build release TLS Tester
        run: make -C apps/tls-tester release

      - name: Validate the native image on both ARM CPU models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv library/build/arm-test-venv
          library/build/arm-test-venv/bin/pip install -r library/tests/requirements-arm.txt
          mkdir -p library/build/release-validation
          for cpu in ti925t pxa270; do
            library/build/arm-test-venv/bin/python library/tests/crypto_oracle_test.py \
              --arm-image library/build/palm/armc0001.bin --cpu "$cpu" \
              | tee "library/build/release-validation/$cpu.log"
          done

      - name: Package outputs
        shell: bash
        run: |
          scripts/package-artifacts.sh
          (cd dist && sha256sum -c SHA256SUMS)
          version="$(sed -n 's/^LIB_VERSION := //p' library/app.mk)"
          scripts/package-release.sh "$version"
          python3 scripts/release.py bundle \
            --ti925t-log library/build/release-validation/ti925t.log \
            --pxa270-log library/build/release-validation/pxa270.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: palm-tls-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 90
